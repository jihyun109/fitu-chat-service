# MySQL 루트 암호.
# 적용 전에 root-password를 실제 값으로 바꿀 것 (또는 sealed-secrets 사용).
# kubectl create secret generic mysql-credentials \
#   --from-literal=root-password='<강한-암호>' \
#   -n fitu
apiVersion: v1
kind: Secret
metadata:
  name: mysql-credentials
  namespace: fitu
type: Opaque
stringData:
  root-password: "REPLACE_ME"

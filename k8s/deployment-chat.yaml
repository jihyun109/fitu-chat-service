apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-service
  namespace: fitu
  labels:
    app: fitu-chat
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fitu-chat
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: fitu-chat
      annotations:
        # OTel Operator가 이 Pod에 OTel Java agent 자동 주입
        # 형식: "<namespace>/<Instrumentation 이름>"
        # fitu_backend와 동일한 Instrumentation 공유 → 일관된 sampler·PII 정책
        instrumentation.opentelemetry.io/inject-java: "fitu/fitu-java"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: chat
          image: jihyun923/fitu-chat-service:latest
          # 매번 Docker Hub에서 pull (로컬 import image 사용 안 함)
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_CONFIG_LOCATION
              value: /config/chat-secret.yml
            - name: TZ
              value: Asia/Seoul
            # OTel trace의 service.name attribute
            - name: OTEL_SERVICE_NAME
              value: "fitu-chat"
            - name: JAVA_TOOL_OPTIONS
              value: "-javaagent:/opt/pyroscope.jar -Duser.timezone=Asia/Seoul -Xms128m -Xmx400m -XX:+UseG1GC -XX:MaxGCPauseMillis=100 -XX:ParallelGCThreads=1 -XX:ConcGCThreads=1"
            - name: PYROSCOPE_APPLICATION_NAME
              value: "fitu-chat-service"
            - name: PYROSCOPE_SERVER_ADDRESS
              value: "http://pyroscope.monitoring.svc.cluster.local:4040"
            - name: PYROSCOPE_FORMAT
              value: "jfr"
            - name: SERVER_SHUTDOWN
              value: "graceful"
            - name: SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE
              value: "20s"
          resources:
            requests:
              cpu: "0.05"
              memory: 256Mi
            limits:
              cpu: "0.6"
              memory: 700Mi
          # OTel agent + Pyroscope agent 두 개 부착으로 부팅이 늦어질 수 있음
          # startupProbe가 성공할 때까지 liveness/readiness 검사 안 함
          # (5s × 36회 = 최대 3분 시작 대기)
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: chat-secret
              mountPath: /config
              readOnly: true
      volumes:
        - name: chat-secret
          secret:
            secretName: chat-secret

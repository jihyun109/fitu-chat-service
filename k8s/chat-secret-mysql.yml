# 벤치마크용 chat-service 설정 — MySQL 모드.
#
# 사용법: 이 파일의 password를 실제 값으로 채운 뒤,
#   kubectl create secret generic chat-secret \
#     --from-file=chat-secret.yml=./chat-secret-mysql.yml \
#     -n fitu --dry-run=client -o yaml | kubectl apply -f -
#   kubectl rollout restart deployment chat-service -n fitu
#
# 주의: deployment-chat.yaml의 SPRING_CONFIG_LOCATION 패턴이
# JAR 내부 application.yml을 통째로 대체하므로, profile 기반 토글이 아니라
# 이 파일 자체로 모든 설정을 담아야 한다.
#
# JPA 의존성이 classpath에 있는 상태에서 mongo 모드로 돌리려면 chat-secret.yml에도
# spring.autoconfigure.exclude로 JPA autoconfig를 막아둬야 함 (별도 작업).

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
      - org.springframework.boot.autoconfigure.mongo.MongoReactiveAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoReactiveDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoReactiveRepositoriesAutoConfiguration

  datasource:
    url: jdbc:mysql://mysql:3306/fitu_chat?rewriteBatchedStatements=true&useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8
    username: root
    password: REPLACE_ME
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 32
      minimum-idle: 4
      connection-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          batch_size: 200
          time_zone: UTC
        order_inserts: true
        order_updates: true
        batch_versioned_data: true
        generate_statistics: false

  data:
    redis:
      host: redis
      port: 6379
      password: wlgus34Wkd
      timeout: 2s

jwt:
  secret: testSecretKey20240316testSecretKey20240316testSecretKey20240316

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, info
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: fitu-chat-service

server:
  port: 8081
